services:
  - type: web
    name: integration-dut1-api
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    # Seul le backend vit ici : le frontend est buildé et servi par Vercel.
    # Render n'installe donc plus les dépendances du frontend (vite, tailwind,
    # react...), ce qui raccourcit nettement le build et la reprise après veille.
    # Les données (Postgres + photos) vivent sur Supabase, pas sur le disque de
    # Render : pas besoin de disque persistant.
    buildCommand: "npm install && node db/migrate.js && node db/setupStorage.js && node db/seed.js"
    startCommand: "node server.js"
    healthCheckPath: /healthz
    # La région ne peut pas être modifiée après la création du service : si le
    # service existe déjà, il faut le recréer pour en changer. Frankfurt est la
    # région Render la plus proche de l'Afrique de l'Ouest.
    # region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      # Origine(s) autorisée(s) à appeler l'API, séparées par des virgules.
      # Ex: https://integration-dut1.vercel.app,*.vercel.app
      # (le "*." couvre les URLs de preview générées par Vercel sur les PR).
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    # migrate.js (CREATE TABLE IF NOT EXISTS) et seed.js (INSERT ... ON CONFLICT
    # DO NOTHING) sont tous les deux idempotents : les relancer à chaque
    # déploiement est sans danger et ne touche jamais aux données réelles déjà
    # présentes sur Supabase.
