services:
  - type: web
    name: integration-dut1
    runtime: node
    plan: free
    branch: main
    # Les données (Postgres + photos) vivent sur Supabase, pas sur le disque de
    # Render : plus besoin de disque persistant ni de préoccupation liée au
    # plan "free" qui réinitialise le système de fichiers à chaque déploiement.
    # --include=dev reste nécessaire car NODE_ENV=production ferait sinon
    # sauter les devDependencies du frontend (vite, @vitejs/plugin-react)
    # pendant le build, alors qu'elles sont indispensables pour "npm run build".
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install && node db/migrate.js && node db/setupStorage.js && node db/seed.js"
    startCommand: "cd backend && node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    # migrate.js (CREATE TABLE IF NOT EXISTS) et seed.js (INSERT ... ON CONFLICT
    # DO NOTHING) sont tous les deux idempotents : les relancer à chaque
    # déploiement est sans danger et ne touche jamais aux données réelles déjà
    # présentes sur Supabase.
