# Vérifie que le frontend build et que le backend s'installe proprement avant
# que Vercel et Render ne déploient le même commit. Un lockfile désynchronisé
# ou une erreur de syntaxe est ainsi visible ici plutôt qu'en production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Build frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Vérifier backend (Render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Contrôle syntaxique
        working-directory: backend
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
